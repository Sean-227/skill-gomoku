<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五里头子奇</title>
<meta name="theme-color" content="#ffd83d">
<meta name="description" content="五里头子奇——带技能的耍赖五子棋">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">


<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A//www.w3.org/2000/svg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'14'%20fill%3D'%23ffd83d'/%3E%3Ccircle%20cx%3D'40'%20cy%3D'34'%20r%3D'13'%20fill%3D'%23262a34'%20stroke%3D'%23ffffff'%20stroke-width%3D'3'/%3E%3Ccircle%20cx%3D'26'%20cy%3D'32'%20r%3D'11'%20fill%3D'%23ffffff'%20stroke%3D'%235a3a14'%20stroke-width%3D'3'/%3E%3Cpolygon%20points%3D'54,8%2057,16%2065,16%2059,21%2061,29%2054,24%2047,29%2049,21%2043,16%2051,16'%20fill%3D'%23ff4d1c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="preload" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&display=swap" as="style">
<link href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffd83d; --bg2:#ffdf5e; --panel:#fffdf2; --panel2:#fff3c6;
  --line:#e8b64a; --orange:#ff4d1c; --yellow:#ffd83d; --blue:#2f6bff; --red:#ff3b47;
  --ink:#4a2e10; --muted:#96651e;
  --orange-soft:rgba(255,77,28,.13); --blue-soft:rgba(47,107,255,.10);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"ZCOOL KuaiLe","Yuanti SC","YouYuan","幼圆","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink); min-height:100vh;
  background:
    radial-gradient(700px 460px at 8% 0%, rgba(255,77,28,.18), transparent 55%),
    radial-gradient(760px 500px at 96% 6%, rgba(47,107,255,.16), transparent 55%),
    radial-gradient(560px 380px at 60% 100%, rgba(255,59,71,.14), transparent 60%),
    linear-gradient(180deg,#ffdf5e 0%,#ffd83d 40%,#ffc94a 100%);
}
.wrap{max-width:1020px;margin:0 auto;padding:20px 16px 48px;position:relative;}
.stars{position:absolute;inset:0;pointer-events:none;}
.stars svg{position:absolute;filter:drop-shadow(0 2px 5px rgba(120,70,10,.25));}
.st-1{top:-4px;right:22px;width:34px;height:34px;opacity:.95;}
.st-2{top:58px;right:120px;width:15px;height:15px;opacity:.6;}
.st-3{top:98px;left:6px;width:18px;height:18px;opacity:.5;}
.st-4{top:26px;left:158px;width:12px;height:12px;opacity:.6;}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 2px 16px;}
.brand .title{
  font-family:"ZCOOL KuaiLe","Yuanti SC","YouYuan","幼圆",sans-serif;font-weight:800;font-size:36px;letter-spacing:1px;margin:0;line-height:1.1;
  color:#2f3bb3;
  text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,2px 2px 0 #fff,0 5px 12px rgba(120,70,10,.3);
}
.brand .title b{color:var(--orange);}
.brand .sub{font-size:15px;color:var(--ink);margin-top:8px;letter-spacing:1px;font-weight:700;}
.newgame{
  flex:none;display:flex;align-items:center;gap:7px;background:var(--orange);border:2px solid #fff;
  color:#fff;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:800;cursor:pointer;
  transition:.18s;font-family:inherit;box-shadow:0 6px 16px rgba(255,77,28,.4);
}
.newgame:hover{background:#ff6a2e;transform:translateY(-1px);}
.newgame svg{width:16px;height:16px;}

.layout{display:grid;gap:18px;}
.board-zone{background:#fffdf2;border:2px solid rgba(120,80,20,.25);border-radius:18px;padding:14px;box-shadow:0 8px 24px rgba(120,80,20,.16);}
.board-zone .top{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;padding:2px 4px 12px;}
.turn{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;flex-wrap:wrap;color:var(--ink);}
.turn .chip{display:inline-flex;align-items:center;gap:7px;}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block;}
.dot.b{background:#17181d;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 1px 3px rgba(0,0,0,.5);}
.dot.w{background:#ffffff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.35);}
.active-tag{font-size:12px;color:#fff;background:var(--orange);border-radius:8px;padding:2px 9px;font-weight:800;}
.energies{display:flex;gap:12px;align-items:center;flex:1 1 100%;justify-content:flex-start;}
.energy{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);font-weight:700;}
.energy .num{font-weight:800;color:var(--orange);font-size:17px;min-width:1.2em;text-align:center;}
.pips{display:flex;gap:2px;}
.pip{width:6px;height:15px;border-radius:2px;background:#f0d697;transition:.15s;}
.pip.on{background:linear-gradient(180deg,#ff9d2e,var(--orange));}
#boardWrap{position:relative;width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;
  background:
    radial-gradient(480px 380px at 50% 0%, rgba(255,255,255,.20), transparent 62%),
    linear-gradient(160deg,#3a6cff,#2350d6 60%,#1e42b4);
  box-shadow:0 14px 34px rgba(30,60,180,.40), inset 0 0 0 2px rgba(255,255,255,.35);}
#board{display:block;width:100%;height:100%;touch-action:manipulation;}
#boardOverlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;
  background:rgba(74,46,16,.62);backdrop-filter:blur(3px);text-align:center;padding:20px;}
#boardOverlay.show{display:flex;}
#boardOverlay h2{font-family:"ZCOOL KuaiLe","Yuanti SC","YouYuan","幼圆",sans-serif;font-weight:800;font-size:28px;margin:0;letter-spacing:1px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25);}
#boardOverlay h2.win{color:#ffd83d;}
#boardOverlay h2.lose{color:#ff8a80;}
#boardOverlay h2.draw{color:#fff;}
#boardOverlay p{color:#f3e6c8;margin:0;font-size:15px;}
.again{background:var(--orange);color:#fff;border:2px solid #fff;border-radius:12px;padding:11px 24px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;box-shadow:0 6px 16px rgba(255,77,28,.4);}
.again:hover{background:#ff6a2e;}
#diceOverlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px;z-index:2;
  background:rgba(74,46,16,.62);backdrop-filter:blur(3px);}
#diceOverlay.show{display:flex;}
.dice-box{background:#fffdf2;border:3px solid #fff;border-radius:18px;padding:20px 22px;max-width:300px;width:100%;
  box-shadow:0 12px 36px rgba(0,0,0,.35);text-align:center;}
.dice-box h2{margin:0;font-family:"ZCOOL KuaiLe","Yuanti SC","YouYuan","幼圆",sans-serif;font-weight:800;font-size:22px;color:var(--ink);letter-spacing:1px;}
.dice-row{display:flex;align-items:center;justify-content:center;gap:14px;margin:16px 0 16px;}
.dice-side p{margin:8px 0 0;font-size:14px;font-weight:800;color:var(--ink);}
.dvs{font-family:"ZCOOL KuaiLe","Yuanti SC","YouYuan","幼圆",sans-serif;font-weight:900;font-size:20px;color:var(--orange);}
.die{width:76px;height:76px;border-radius:14px;background:#fff;
  box-shadow:inset 0 0 0 3px #2f6bff,0 6px 14px rgba(47,107,255,.35);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:10px;gap:5px;}
.die .p{background:var(--orange);border-radius:50%;width:100%;height:100%;}
.dmsg{min-height:18px;margin:10px 0 0;font-size:14px;font-weight:800;color:var(--orange);}
#diceOverlay .again{margin-top:4px;}

.panel{display:flex;flex-direction:column;gap:16px;}
.card{background:#fffdf2;border:2px solid rgba(120,80,20,.22);border-radius:16px;padding:16px;box-shadow:0 8px 22px rgba(120,80,20,.14);}
.card h3{margin:0 0 12px;font-size:14px;color:var(--muted);letter-spacing:2px;font-weight:800;}
.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.skill{
  position:relative;background:var(--panel2);border:2px solid rgba(120,80,20,.16);border-radius:13px;padding:12px 12px 11px;
  cursor:pointer;transition:.16s;text-align:left;font-family:inherit;color:var(--ink);overflow:hidden;
}
.skill:hover{border-color:var(--orange);transform:translateY(-1px);}
.skill:disabled{opacity:.45;cursor:not-allowed;transform:none;border-color:rgba(120,80,20,.16);}
.skill .ic{width:34px;height:34px;border-radius:9px;background:var(--orange-soft);display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.skill .ic svg{width:20px;height:20px;stroke:var(--orange);fill:none;stroke-width:1.8;}
.skill .nm{font-size:16px;font-weight:800;display:flex;align-items:center;gap:7px;}
.skill .cost{margin-left:auto;font-size:12px;font-weight:800;color:#fff;background:var(--orange);border-radius:7px;padding:1px 8px;}
.skill .ds{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45;}
.skill.wide{grid-column:1/-1;display:flex;align-items:center;gap:13px;border-color:rgba(255,77,28,.45);background:linear-gradient(135deg,rgba(255,77,28,.12),var(--panel2) 55%);}
.skill.wide .ic{margin-bottom:0;flex:none;}
.skill.wide .meta{flex:1;min-width:0;}
.skill.wide .nm{margin:0 0 2px;}
.skill.wide .ds{margin-top:2px;}
.hint-lines{font-size:13px;line-height:1.8;color:var(--ink);margin:0;padding-left:18px;}
.hint-lines li::marker{color:var(--orange);}
.foot{font-size:12px;color:#a8741e;text-align:center;margin-top:20px;font-weight:700;}
.status{font-size:15px;min-height:20px;color:var(--orange);margin:0;padding:0 2px;font-weight:800;}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#fffdf2;border:2px solid var(--orange);
  color:var(--ink);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 10px 26px rgba(120,80,20,.35);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media (min-width:760px){
  .layout{grid-template-columns:minmax(0,1fr) 360px;align-items:start;}
  .board-zone{padding:18px;}
  .skills{grid-template-columns:1fr 1fr;}
  .energies{flex:0 0 auto;justify-content:flex-end;margin-left:auto;}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="stars">
      <svg class="st-1" viewBox="0 0 24 24"><path fill="#ff4d1c" d="M12 2l2.6 5.6 6.1.7-4.6 4.1 1.3 6-5.4-3-5.4 3 1.3-6L3.3 8.3l6.1-.7z"/></svg>
      <svg class="st-2" viewBox="0 0 24 24"><path fill="#2f6bff" d="M12 2l2.6 5.6 6.1.7-4.6 4.1 1.3 6-5.4-3-5.4 3 1.3-6L3.3 8.3l6.1-.7z"/></svg>
      <svg class="st-3" viewBox="0 0 24 24"><path fill="#ff3b47" d="M12 2l2.6 5.6 6.1.7-4.6 4.1 1.3 6-5.4-3-5.4 3 1.3-6L3.3 8.3l6.1-.7z"/></svg>
      <svg class="st-4" viewBox="0 0 24 24"><path fill="#7b4dff" d="M12 2l2.6 5.6 6.1.7-4.6 4.1 1.3 6-5.4-3-5.4 3 1.3-6L3.3 8.3l6.1-.7z"/></svg>
    </div>
    <div class="brand">
      <h1 class="title">五里<b>头子奇</b></h1>
      <div class="sub">会耍赖的才是真高手 · SHOWTIME</div>
    </div>
    <button class="newgame" id="btnNew">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      重开一局
    </button>
  </header>

  <div class="layout">
    <section class="board-zone">
      <div class="top">
        <div class="turn">
          <span class="chip"><span class="dot b"></span>你</span>
          <span id="vs">vs</span>
          <span class="chip"><span class="dot w"></span>电脑</span>
          <span class="active-tag" id="turnTag">轮到你</span>
        </div>
        <div class="energies">
          <div class="energy"><span class="pips" id="pipsMe"></span><span class="num" id="enMe">3</span></div>
          <div class="energy"><span class="num" id="enAi">3</span><span class="pips" id="pipsAi"></span></div>
        </div>
      </div>
      <div id="boardWrap">
        <canvas id="board"></canvas>
        <div id="diceOverlay">
          <div class="dice-box">
            <h2>投骰子 · 定先后</h2>
            <div class="dice-row">
              <div class="dice-side"><div class="die" id="dieMe"></div><p>你</p></div>
              <span class="dvs">VS</span>
              <div class="dice-side"><div class="die" id="dieAi"></div><p>电脑</p></div>
            </div>
            <button class="again" id="btnRoll">投骰子</button>
            <p class="dmsg" id="diceMsg"></p>
          </div>
        </div>
        <div id="boardOverlay">
          <h2 id="ovTitle">你赢了</h2>
          <p id="ovSub">漂亮的一局</p>
          <button class="again" id="btnAgain">再来一局</button>
        </div>
      </div>
      <p class="status" id="status">投骰子决定谁先走。</p>
    </section>

    <aside class="panel">
      <div class="card">
        <h3>技能（消耗能量）</h3>
        <div class="skills">
          <button class="skill" data-k="sand">
            <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 19c3-4 13-4 16 0M5 5l3 3M13 5l3 3"/><circle cx="10.5" cy="4" r="1.7"/></svg></div>
            <div class="nm">飞沙走石<span class="cost">4</span></div>
            <div class="ds">把电脑一颗棋子扔进什刹海</div>
          </button>
          <button class="skill" data-k="freeze">
            <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3v18M4 7l16 10M20 7L4 17M12 3l-2 2M12 3l2 2M12 21l-2-2M12 21l2-2M4 7l2 1M20 7l-2 1M4 17l2-1M20 17l-2-1"/></svg></div>
            <div class="nm">静如止水<span class="cost">3</span></div>
            <div class="ds">凝结时间，电脑速冻跳过一回合</div>
          </button>
          <button class="skill" data-k="rewind">
            <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7M3 4v5h5"/></svg></div>
            <div class="nm">时光倒流<span class="cost">2</span></div>
            <div class="ds">撤销电脑刚下的那颗棋子</div>
          </button>
          <button class="skill" data-k="chaos">
            <div class="ic"><svg viewBox="0 0 24 24"><path d="M7 7h10M14 4l3 3-3 3M17 17H7M10 14l-3 3 3 3"/></svg></div>
            <div class="nm">两极反转<span class="cost">3</span></div>
            <div class="ds">放电脑黑历史，它下一手随机乱走</div>
          </button>
          <button class="skill" data-k="move">
            <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 20V8M8 12l4-4 4 4M3 20h18"/></svg></div>
            <div class="nm">调呈离山<span class="cost">4</span></div>
            <div class="ds">调虎离山，把电脑一颗棋子挪走</div>
          </button>
          <button class="skill" data-k="smash">
            <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 19l6-9 3 5 2-3 5 7Z"/></svg></div>
            <div class="nm">力拔山兮<span class="cost">8</span></div>
            <div class="ds">掀翻棋盘，直接获胜</div>
          </button>
          <button class="skill wide" data-k="crossbow">
            <div class="ic"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><path d="M4 6h16M4 18h16"/></svg></div>
            <div class="meta">
              <div class="nm">诸葛连弩<span class="cost">6</span></div>
              <div class="ds">机关一响，连落三子，箭无虚发</div>
            </div>
          </button>
        </div>
      </div>
      <div class="card">
        <h3>对局规则</h3>
        <ul class="hint-lines">
          <li>任意一方先连成 5 子（横/竖/斜）即胜。</li>
          <li>每落一子 +1 能量（你上限 10，电脑上限 10），开局你 4 点、电脑 5 点。</li>
          <li>技能灵感来自《喜人奇妙夜》——会耍赖的才是真高手。</li>
          <li>电脑更会耍赖：常用「飞沙走石」「调呈离山」破你布局，攒够能量还会「静如止水」连下两子。</li>
        </ul>
      </div>
    </aside>
  </div>

  <p class="foot">五里头子奇 · 单机对战</p>
</div>
<div id="toast"></div>

<script>
(function(){
"use strict";
var N=15, WIN=100000;
var canvas=document.getElementById('board'), ctx=canvas.getContext('2d');
var wrap=document.getElementById('boardWrap');
var pad,cell,size;

var state;
var skills={
  sand:{cost:4}, freeze:{cost:3}, rewind:{cost:2},
  chaos:{cost:3}, move:{cost:4}, smash:{cost:8}, crossbow:{cost:6}
};
var hoverR=-1,hoverC=-1;
var visionCells=[], hintCells=[], winCells=[];
var actx=null;

var DICE_DOTS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function dieFace(n){
  var dots=DICE_DOTS[n]||[], s='', i;
  for(i=0;i<9;i++) s += (dots.indexOf(i)>=0)?'<span class="p"></span>':'<span></span>';
  return s;
}
function showDice(){
  state.diceDone=false;
  document.getElementById('dieMe').innerHTML=dieFace(6);
  document.getElementById('dieAi').innerHTML=dieFace(6);
  document.getElementById('diceMsg').textContent='';
  document.getElementById('btnRoll').disabled=false;
  document.getElementById('diceOverlay').classList.add('show');
  document.getElementById('boardOverlay').classList.remove('show');
  setStatus('投骰子，点数大的一方先走');
  renderUI(); draw();
}
function rollDice(){
  if(state.diceDone)return;
  var me=1+Math.floor(Math.random()*6), ai=1+Math.floor(Math.random()*6);
  document.getElementById('dieMe').innerHTML=dieFace(me);
  document.getElementById('dieAi').innerHTML=dieFace(ai);
  if(me===ai){ document.getElementById('diceMsg').textContent='平局（'+me+' 对 '+ai+'），再投一次'; return; }
  state.diceDone=true;
  document.getElementById('btnRoll').disabled=true;
  var playerWon=me>ai;
  document.getElementById('diceMsg').textContent= playerWon
    ? ('你掷出 '+me+'，电脑掷出 '+ai+'，你先走！')
    : ('电脑掷出 '+ai+'，你掷出 '+me+'，电脑先走！');
  playSound();
  setTimeout(function(){
    document.getElementById('diceOverlay').classList.remove('show');
    if(playerWon){ state.turn='player'; setStatus('你先走（执黑）'); renderUI(); draw(); }
    else { startAi(); }
  }, 900);
}
function init(){
  state={
    board:Array.from({length:N},function(){return new Array(N).fill(0);}),
    turn:'player', playerEnergy:4, aiEnergy:5,
    phase:'normal', gameOver:false,
    aiFrozen:false, aiChaos:false, aiLastMove:null, pickAI:null, multiLeft:0, diceDone:false
  };
  visionCells=[]; hintCells=[]; winCells=[];
  hoverR=-1;hoverC=-1;
  document.getElementById('boardOverlay').classList.remove('show');
  renderUI(); draw();
  showDice();
}

function inB(r,c){return r>=0&&r<N&&c>=0&&c<N;}
function addEnergy(who){
  if(who==='player'){state.playerEnergy=Math.min(10,state.playerEnergy+1);}
  else{state.aiEnergy=Math.min(10,state.aiEnergy+1);}
}

/* ---------- 落子与胜负 ---------- */
function lineLen(r,c,dr,dc,p){
  var cnt=1,rr=r+dr,cc=c+dc;
  while(inB(rr,cc)&&state.board[rr][cc]===p){cnt++;rr+=dr;cc+=dc;}
  rr=r-dr;cc=c-dc;
  while(inB(rr,cc)&&state.board[rr][cc]===p){cnt++;rr-=dr;cc-=dc;}
  return cnt;
}
function checkWin(r,c,p){
  var dirs=[[1,0],[0,1],[1,1],[1,-1]],i,d,len;
  for(i=0;i<4;i++){
    d=dirs[i]; len=lineLen(r,c,d[0],d[1],p);
    if(len>=5){
      var cells=[[r,c]];
      var rr=r+d[0],cc=c+d[1];
      while(inB(rr,cc)&&state.board[rr][cc]===p){cells.push([rr,cc]);rr+=d[0];cc+=d[1];}
      rr=r-d[0];cc=c-d[1];
      while(inB(rr,cc)&&state.board[rr][cc]===p){cells.push([rr,cc]);rr-=d[0];cc-=d[1];}
      winCells=cells;
      return true;
    }
  }
  return false;
}
function boardFull(){
  for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(state.board[r][c]===0)return false;
  return true;
}
function endGame(winner){
  state.gameOver=true;
  var ov=document.getElementById('boardOverlay');
  var t=document.getElementById('ovTitle'),s=document.getElementById('ovSub');
  if(winner==='player'){t.className='win';t.textContent='你赢了';s.textContent='漂亮，技能运用得当';}
  else if(winner==='ai'){t.className='lose';t.textContent='电脑获胜';s.textContent='再来一局，技能也许能翻盘';}
  else{t.className='draw';t.textContent='平局';s.textContent='棋盘已满';}
  ov.classList.add('show');
  renderUI(); draw();
}

/* ---------- 玩家操作 ---------- */
function onCell(r,c){
  if(state.gameOver)return;
  if(!state.diceDone)return;
  if(state.phase==='remove'){ /* 飞沙走石：扔电脑棋子 */
    if(state.board[r][c]===2){
      state.board[r][c]=0; state.phase='normal'; clearHighlights(); playSound();
      renderUI();draw();setStatus('飞沙走石：一颗白子已被扔进什刹海');
    }else{toast('请点电脑（白）的棋子');}
    return;
  }
  if(state.phase==='pickAI'){ /* 调呈离山：先选要挪的白子 */
    if(state.board[r][c]===2){ state.pickAI={r:r,c:c}; state.phase='placeAI'; renderUI();draw();setStatus('再点一个空格，把它挪过去'); }
    else{toast('请先点电脑（白）的棋子');}
    return;
  }
  if(state.phase==='placeAI'){ /* 调呈离山：落到空格 */
    if(!state.pickAI)return;
    if(state.board[r][c]!==0){toast('这里不是空格');return;}
    state.board[state.pickAI.r][state.pickAI.c]=0;
    state.board[r][c]=2; state.pickAI=null; state.phase='normal';
    clearHighlights();playSound();
    renderUI();draw();
    if(checkWin(r,c,2)){endGame('ai');return;}
    checkDraw();startAi();
    return;
  }
  if(state.turn!=='player')return;
  if(state.board[r][c]!==0){toast('此处已有棋子');return;}
  state.board[r][c]=1;
  state.lastMove=[r,c];
  addEnergy('player');playSound();
  if(checkWin(r,c,1)){endGame('player');return;}
  if(state.phase==='multi'){ /* 诸葛连弩：连落三子 */
    state.multiLeft--;
    if(state.multiLeft>0){renderUI();draw();setStatus('诸葛连弩：还可再落 '+state.multiLeft+' 子');return;}
    state.phase='normal';
  }
  clearHighlights();renderUI();draw();checkDraw();startAi();
}
function checkDraw(){ if(boardFull()) endGame('draw'); }

/* ---------- 评分与AI ---------- */
function openEnds(r,c,dr,dc,p){
  var open=0,rr=r+dr,cc=c+dc;
  while(inB(rr,cc)&&state.board[rr][cc]===p){rr+=dr;cc+=dc;}
  if(inB(rr,cc)&&state.board[rr][cc]===0)open++;
  rr=r-dr;cc=c-dc;
  while(inB(rr,cc)&&state.board[rr][cc]===p){rr-=dr;cc-=dc;}
  if(inB(rr,cc)&&state.board[rr][cc]===0)open++;
  return open;
}
function dirScore(r,c,p,dr,dc){
  if(state.board[r][c]!==0)return 0;
  var len=lineLen(r,c,dr,dc,p);
  if(len>=5)return WIN;
  var op=openEnds(r,c,dr,dc,p);
  if(len===4&&op===2)return 12000;
  if(len===4&&op===1)return 6000;
  if(len===3&&op===2)return 1500;
  if(len===3&&op===1)return 300;
  if(len===2&&op===2)return 120;
  if(len===2&&op===1)return 30;
  return 5;
}
function scoreCell(r,c,p){
  if(state.board[r][c]!==0)return 0;
  return dirScore(r,c,p,1,0)+dirScore(r,c,p,0,1)+dirScore(r,c,p,1,1)+dirScore(r,c,p,1,-1);
}
function maxThreat(p){
  var m=0,v,r,c;
  for(r=0;r<N;r++)for(c=0;c<N;c++){
    if(state.board[r][c]===0){v=scoreCell(r,c,p);if(v>m)m=v;}
  }
  return m;
}
function aiBestMove(){
  var best=null,bestSc=-1,r,c,atk,def,sc;
  for(r=0;r<N;r++)for(c=0;c<N;c++){
    if(state.board[r][c]!==0)continue;
    atk=scoreCell(r,c,2);def=scoreCell(r,c,1);
    if(atk>=WIN)return {r:r,c:c};
    if(def>=WIN)return {r:r,c:c};
    sc=atk*1.05+def;
    if(sc>bestSc){bestSc=sc;best={r:r,c:c};}
  }
  return best;
}
function stonePotential(r,c,p){
  var dirs=[[1,0],[0,1],[1,1],[1,-1]],i,dr,dc,left,right,cnt,op,val,best=0;
  for(i=0;i<4;i++){
    dr=dirs[i][0];dc=dirs[i][1];
    left=0;right=0;var rr,cc;
    rr=r-dr;cc=c-dc;while(inB(rr,cc)&&state.board[rr][cc]===p){left++;rr-=dr;cc-=dc;}
    rr=r+dr;cc=c+dc;while(inB(rr,cc)&&state.board[rr][cc]===p){right++;rr+=dr;cc+=dc;}
    cnt=1+left+right;
    op=0;
    if(inB(r-dr,c-dc)&&state.board[r-dr][c-dc]===0)op++;
    if(inB(r+dr,c+dc)&&state.board[r+dr][c+dc]===0)op++;
    if(cnt>=5)val=WIN;else if(cnt===4&&op===2)val=12000;else if(cnt===4&&op===1)val=6000;
    else if(cnt===3&&op===2)val=1500;else if(cnt===3&&op===1)val=300;else val=5;
    if(val>best)best=val;
  }
  return best;
}
function aiDangerStone(){
  var best=null,bestVal=0,r,c,v;
  for(r=0;r<N;r++)for(c=0;c<N;c++){
    if(state.board[r][c]===1){v=stonePotential(r,c,1);if(v>bestVal){bestVal=v;best={r:r,c:c};}}
  }
  return bestVal>=1500?best:null;
}
function aiRandomMove(){
  var empty=[],r,c;
  for(r=0;r<N;r++)for(c=0;c<N;c++)if(state.board[r][c]===0)empty.push([r,c]);
  if(!empty.length)return null;
  var p=empty[Math.floor(Math.random()*empty.length)];
  return {r:p[0],c:p[1]};
}
/* 电脑「调呈离山」：把你的关键子挪到不会给你造成五连的空位 */
function aiRelocateDest(){
  var empt=[],r,c;
  for(r=0;r<N;r++)for(c=0;c<N;c++){
    if(state.board[r][c]!==0)continue;
    if(lineLen(r,c,1,0)>=5||lineLen(r,c,0,1)>=5||lineLen(r,c,1,1)>=5||lineLen(r,c,1,-1)>=5)continue;
    empt.push([r,c]);
  }
  if(!empt.length)return null;
  var p=empt[Math.floor(Math.random()*empt.length)];
  return {r:p[0],c:p[1]};
}
/* 电脑「静如止水」：判断自己是否有活三机会可以连下两子 */
function aiHasDoubleSetup(){
  var r,c;
  for(r=0;r<N;r++)for(c=0;c<N;c++)if(state.board[r][c]===0&&scoreCell(r,c,2)>=1500)return true;
  return false;
}
function aiTurn(){
  if(state.gameOver)return;
  if(state.aiFrozen){ /* 玩家对它用静如止水：被速冻跳过 */
    state.aiFrozen=false;
    state.turn='player'; state.phase='normal';
    renderUI();draw();setStatus('静如止水：电脑被冻住，轮到你落子');
    return;
  }
  var threat=maxThreat(1);
  var usedDouble=false;
  /* 技能决策：你布局很强时，电脑用「飞沙走石」扔或「调呈离山」挪你的关键子 */
  if(threat>=1500 && threat<WIN){
    var opts=[];
    if(state.aiEnergy>=4)opts.push('remove');
    if(state.aiEnergy>=5)opts.push('relocate');
    if(opts.length){
      var s=opts[Math.floor(Math.random()*opts.length)];
      var t=aiDangerStone();
      if(t){
        if(s==='remove'){
          state.board[t.r][t.c]=0; state.aiEnergy-=4;
          toast('电脑施展「飞沙走石」，扔了你的关键子');
        }else{
          var dest=aiRelocateDest();
          if(dest){
            state.board[t.r][t.c]=0; state.board[dest.r][dest.c]=1; state.aiEnergy-=5;
            toast('电脑施展「调呈离山」，把你的棋子调走了');
          }
        }
      }
    }
  }else if(state.aiEnergy>=6 && threat<1200){
    usedDouble=aiHasDoubleSetup();
    if(usedDouble) state.aiEnergy-=6;
  }
  var place=function(){
    var m=state.aiChaos?aiRandomMove():aiBestMove();
    state.aiChaos=false;
    if(m){
      state.board[m.r][m.c]=2;
      state.aiLastMove=[m.r,m.c];
      state.lastMove=[m.r,m.c];
      addEnergy('ai');
      if(checkWin(m.r,m.c,2)){endGame('ai');return true;}
    }
    return false;
  };
  if(place())return;
  if(usedDouble && !state.gameOver){
    toast('电脑施展「静如止水」，冻结时间连下两子');
    if(place())return;
  }
  state.turn='player'; state.phase='normal';
  renderUI();draw();checkDraw();
  if(!state.gameOver)setStatus('轮到你落子');
}
function startAi(){
  state.turn='ai';setStatus('电脑思考中…');renderUI();draw();
  setTimeout(aiTurn,560);
}

/* ---------- 技能 ---------- */
function clearHighlights(){visionCells=[];hintCells=[];}
function activateSkill(k){
  if(state.gameOver||state.turn!=='player'){toast('现在不能使用技能');return;}
  var s=skills[k];
  if(state.playerEnergy<s.cost){toast('能量不足');return;}
  if(state.phase!=='normal'){toast('请先完成当前操作');return;}
  state.playerEnergy-=s.cost;playSound();
  if(k==='sand'){
    state.phase='remove';
    setStatus('飞沙走石：点击电脑（白）的棋子，扔进什刹海');
  }else if(k==='freeze'){
    state.aiFrozen=true;
    setStatus('静如止水：电脑被速冻，你再落一子');
  }else if(k==='rewind'){
    if(state.aiLastMove&&state.board[state.aiLastMove[0]][state.aiLastMove[1]]===2){
      state.board[state.aiLastMove[0]][state.aiLastMove[1]]=0;
      state.aiLastMove=null;
      setStatus('时光倒流：电脑刚落的棋子已消失');
    }else{
      state.playerEnergy+=s.cost;
      toast('电脑还没落子，无法倒流（能量已返还）');
    }
  }else if(k==='chaos'){
    state.aiChaos=true;
    setStatus('两极反转：放出黑历史，电脑下一手将乱走');
  }else if(k==='move'){
    state.phase='pickAI';
    setStatus('调呈离山：先点电脑（白）的一颗棋子');
  }else if(k==='smash'){
    endGame('player');
    setStatus('力拔山兮：掀翻棋盘，直接获胜！');
  }else if(k==='crossbow'){
    state.phase='multi'; state.multiLeft=3;
    setStatus('诸葛连弩：请连落三子');
  }
  renderUI();draw();
}

/* ---------- 渲染 ---------- */
function setStatus(t){document.getElementById('status').textContent=t;}
function renderUI(){
  var me=state.playerEnergy,ai=state.aiEnergy;
  var pips=function(n,cap){var s='';for(var i=0;i<cap;i++)s+='<span class="pip'+(i<n?' on':'')+'"></span>';return s;};
  document.getElementById('pipsMe').innerHTML=pips(me,10);
  document.getElementById('pipsAi').innerHTML=pips(ai,10);
  document.getElementById('enMe').textContent=me;
  document.getElementById('enAi').textContent=ai;
  var tag=document.getElementById('turnTag');
  if(!state.diceDone){tag.textContent='掷骰定先后';tag.style.opacity=.7;}
  else if(state.gameOver){tag.textContent='已结束';tag.style.opacity=.6;}
  else if(state.turn==='player'){tag.textContent='轮到你';tag.style.opacity=1;}
  else{tag.textContent='电脑思考';tag.style.opacity=.7;}
  var busy=state.phase!=='normal';
  ['sand','freeze','rewind','chaos','move','smash','crossbow'].forEach(function(k){
    var b=document.querySelector('.skill[data-k="'+k+'"]');
    var can=state.playerEnergy>=skills[k].cost;
    b.disabled = state.gameOver||state.turn!=='player'||!can||busy;
    b.style.opacity = (can&&!busy)?1:0.42;
  });
}
function fitCanvas(){
  var w=wrap.clientWidth;
  size=w;
  var dpr=window.devicePixelRatio||1;
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(w*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  pad=size*0.058;cell=(size-pad*2)/(N-1);
  draw();
}
function cellXY(i){return pad+i*cell;}
function draw(){
  if(!state||!size)return;
  var i,r,c,x,y;
  // board bg
  ctx.fillStyle='#2651cf';
  ctx.fillRect(0,0,size,size);
  var g=ctx.createLinearGradient(0,0,size,size);
  g.addColorStop(0,'#3a6cff');g.addColorStop(1,'#1e42b4');
  ctx.fillStyle=g;ctx.fillRect(0,0,size,size);
  // grid
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;
  for(i=0;i<N;i++){
    ctx.beginPath();ctx.moveTo(cellXY(i),pad);ctx.lineTo(cellXY(i),size-pad);ctx.stroke();
    ctx.beginPath();ctx.moveTo(pad,cellXY(i));ctx.lineTo(size-pad,cellXY(i));ctx.stroke();
  }
  // star points
  ctx.fillStyle='rgba(255,216,61,.95)';
  var stars=[3,7,11];
  for(i=0;i<3;i++)for(var j=0;j<3;j++){x=cellXY(stars[i]);y=cellXY(stars[j]);ctx.beginPath();ctx.arc(x,y,size*0.006,0,6.283);ctx.fill();}
  // border
  ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=2;
  ctx.strokeRect(pad-1,pad-1,(size-2*pad)+2,(size-2*pad)+2);

  // stones
  for(r=0;r<N;r++)for(c=0;c<N;c++){
    if(state.board[r][c]!==0)drawStone(cellXY(c),cellXY(r),state.board[r][c]);
  }
  // last move mark
  if(state.lastMove){
    ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.beginPath();ctx.arc(cellXY(state.lastMove[1]),cellXY(state.lastMove[0]),size*0.010,0,6.283);ctx.fill();
  }
  // vision highlights (threat)
  visionCells.forEach(function(p){
    ctx.fillStyle='rgba(255,59,71,.9)';
    ctx.beginPath();ctx.arc(cellXY(p[1]),cellXY(p[0]),size*0.018,0,6.283);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.4;
    ctx.beginPath();ctx.arc(cellXY(p[1]),cellXY(p[0]),size*0.026,0,6.283);ctx.stroke();
  });
  // hint highlight
  hintCells.forEach(function(p){
    ctx.strokeStyle='#ff9d2e';ctx.lineWidth=2.4;
    ctx.beginPath();ctx.arc(cellXY(p[1]),cellXY(p[0]),size*0.030,0,6.283);ctx.stroke();
    ctx.fillStyle='rgba(255,157,46,.35)';
    ctx.beginPath();ctx.arc(cellXY(p[1]),cellXY(p[0]),size*0.018,0,6.283);ctx.fill();
  });
  // win line
  if(winCells.length){
    ctx.strokeStyle='rgba(255,216,61,.95)';ctx.lineWidth=3;
    ctx.beginPath();
    winCells.forEach(function(p,idx){x=cellXY(p[1]);y=cellXY(p[0]);idx?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    ctx.stroke();
  }
  // hover ghost
  if(hoverR>=0&&hoverC>=0&&!state.gameOver&&state.turn==='player'){
    var hc=state.board[hoverR][hoverC];
    if(state.phase==='remove'||state.phase==='pickAI'){
      if(hc===2){ctx.strokeStyle='rgba(255,59,71,.95)';ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(cellXY(hoverC),cellXY(hoverR),size*0.030,0,6.283);ctx.stroke();}
    }else if(state.phase==='placeAI'){
      if(hc===0){ctx.strokeStyle='#ffd83d';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cellXY(hoverC),cellXY(hoverR),size*0.030,0,6.283);ctx.stroke();}
    }else if(hc===0){
      ctx.fillStyle='rgba(22,24,27,.5)';
      ctx.beginPath();ctx.arc(cellXY(hoverC),cellXY(hoverR),size*0.033,0,6.283);ctx.fill();
    }
  }
}
function drawStone(x,y,p){
  var rad=cell*0.42;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=size*0.012;ctx.shadowOffsetY=size*0.004;
  if(p===1){ // black
    var bg=ctx.createRadialGradient(x-rad*0.4,y-rad*0.45,rad*0.1,x,y,rad);
    bg.addColorStop(0,'#3a3d44');bg.addColorStop(1,'#121316');
    ctx.fillStyle=bg;
  }else{ // white
    var wg=ctx.createRadialGradient(x-rad*0.4,y-rad*0.45,rad*0.1,x,y,rad);
    wg.addColorStop(0,'#ffffff');wg.addColorStop(1,'#d9d2be');
    ctx.fillStyle=wg;
  }
  ctx.beginPath();ctx.arc(x,y,rad,0,6.283);ctx.fill();
  ctx.restore();
}
/* ---------- 事件 ---------- */
function evtPos(e){  var rect=canvas.getBoundingClientRect();
  var x=(e.clientX!=null?e.clientX:e.touches[0].clientX)-rect.left;
  var y=(e.clientY!=null?e.clientY:e.touches[0].clientY)-rect.top;
  return {x:x,y:y};
}
function cellFromXY(x,y){
  var c=Math.round((x-pad)/cell),r=Math.round((y-pad)/cell);
  if(!inB(r,c))return null;
  var dx=x-(pad+c*cell),dy=y-(pad+r*cell);
  if(Math.abs(dx)>cell*0.45||Math.abs(dy)>cell*0.45)return null;
  return {r:r,c:c};
}
canvas.addEventListener('click',function(e){var p=evtPos(e),cc=cellFromXY(p.x,p.y);if(cc)onCell(cc.r,cc.c);});
canvas.addEventListener('mousemove',function(e){var p=evtPos(e),cc=cellFromXY(p.x,p.y);hoverR=cc?cc.r:-1;hoverC=cc?cc.c:-1;draw();});
canvas.addEventListener('mouseleave',function(){hoverR=-1;hoverC=-1;draw();});
canvas.addEventListener('touchmove',function(e){var p=evtPos(e),cc=cellFromXY(p.x,p.y);hoverR=cc?cc.r:-1;hoverC=cc?cc.c:-1;draw();},{passive:true});
document.querySelectorAll('.skill').forEach(function(b){
  b.addEventListener('click',function(){activateSkill(b.getAttribute('data-k'));});
});
document.getElementById('btnNew').addEventListener('click',init);
document.getElementById('btnAgain').addEventListener('click',init);
document.getElementById('btnRoll').addEventListener('click',rollDice);
window.addEventListener('resize',fitCanvas);

var toastTimer=null;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},1500);
}
function playSound(){
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.value=680;o.frequency.exponentialRampToValueAtTime(480,actx.currentTime+0.05);
    g.gain.setValueAtTime(0.04,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.07);
    o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+0.08);
  }catch(e){}
}

/* track last move */
init();
fitCanvas();
window.addEventListener('resize',fitCanvas);
})();
</script>
